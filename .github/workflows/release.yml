name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and test
        run: ./build.ps1
      - name: Package installer and portable ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./build/windows/package.ps1 -Tag $env:RELEASE_TAG
      - name: Verify install and uninstall
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installer = Get-ChildItem "build/bin/release/$env:RELEASE_TAG/*-setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'cli-bridger-install-test'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode) { throw "Installer exited with $($process.ExitCode)" }
          foreach ($file in @('cli-bridger.exe', 'demo-cli.exe', 'README.md', 'LICENSE')) {
            if (-not (Test-Path -LiteralPath "$installDir/$file")) { throw "Installed file missing: $file" }
          }
          if ((Get-FileHash "$installDir/cli-bridger.exe").Hash -ne (Get-FileHash 'build/bin/cli-bridger.exe').Hash) { throw 'Installed executable differs from build.' }
          $process = Start-Process -FilePath "$installDir/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -or (Test-Path "$installDir/cli-bridger.exe")) { throw 'Uninstall verification failed.' }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath "build/bin/release/$env:RELEASE_TAG" -File | ForEach-Object FullName)
          if ($assets.Count -ne 3) { throw 'Expected installer, portable ZIP and checksums.' }
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--generate-notes', '--title', "CLI Bridger $env:RELEASE_TAG")
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += @('--prerelease', '--latest=false') }
          & gh @releaseArgs @assets
          if ($LASTEXITCODE) { throw 'GitHub Release publication failed.' }
